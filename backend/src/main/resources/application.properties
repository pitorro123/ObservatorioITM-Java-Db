spring.application.name=ObservatorioITM-Back
server.port=${SERVER_PORT:8080}

# Carga variables desde el archivo .env (lo ajustas tu mismo)
spring.config.import=optional:file:.env[.properties]

# ── Base de datos (PostgreSQL) ──
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-snowy-sound-a5pjv9mb.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_HKbk1JF2VupU}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Correo SMTP / HTTP API (Brevo / Resend / Gmail) ──
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000

# Proveedor HTTP para entornos en la nube (Render) donde SMTP 587/465 está bloqueado
correo.brevo.api-key=${BREVO_API_KEY:}
correo.resend.api-key=${RESEND_API_KEY:}
correo.remitente-nombre=${MAIL_FROM_NAME:Observatorio Astronómico ITM}


# ── Aplicación ──
# Frontend permitido (CORS)
app.cors.origenes=${FRONTEND_URL:http://localhost:5173}
# Usuario administrador inicial (se crea solo si la base está vacía)
app.admin.email=${ADMIN_EMAIL:admin@itm.edu.co}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.public.base-url=${PUBLIC_BASE_URL:${FRONTEND_URL:https://observatorio-itm-java-db-p1bi.vercel.app}}

springdoc.swagger-ui.path=/swagger-ui.html