<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2050 860" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Header Banner -->
  <g transform="translate(50, 25)">
    <rect width="1950" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <path d="M 0 68 L 1950 68" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <text x="25" y="32" fill="#f8fafc" font-size="20" font-weight="700">OBSERVATORIO ASTRONÓMICO ITM  -  DIAGRAMA ENTIDAD RELACIÓN (3FN)</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Motor: PostgreSQL (Neon Tech Cloud)  |  Modelo Relacional Normalizado con Control de Asistencia QR</text>
  </g>

  <!-- 1. roles -->
  <g transform="translate(50, 120)">
    <rect width="280" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <rect width="280" height="34" rx="10" fill="#0f172a"/>
    <text x="12" y="23" fill="#f8fafc" font-size="14" font-weight="700">🛡️ roles</text>
    <text x="12" y="55" fill="#34d399" font-size="10" font-weight="700">PK</text>
    <text x="45" y="55" fill="#f8fafc" font-size="12" font-family="monospace">id</text>
    <text x="180" y="55" fill="#fbbf24" font-size="11" font-family="monospace">BIGSERIAL</text>
    <text x="45" y="77" fill="#f8fafc" font-size="12" font-family="monospace">nombre</text>
    <text x="180" y="77" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(50)</text>
  </g>

  <!-- 2. roles_permisos -->
  <g transform="translate(380, 120)">
    <rect width="280" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <rect width="280" height="34" rx="10" fill="#0f172a"/>
    <text x="12" y="23" fill="#f8fafc" font-size="14" font-weight="700">🔗 roles_permisos</text>
    <text x="12" y="55" fill="#fbbf24" font-size="10" font-weight="700">PK/FK</text>
    <text x="55" y="55" fill="#f8fafc" font-size="12" font-family="monospace">rol_id</text>
    <text x="195" y="55" fill="#fbbf24" font-size="11" font-family="monospace">BIGINT</text>
    <text x="12" y="77" fill="#fbbf24" font-size="10" font-weight="700">PK/FK</text>
    <text x="55" y="77" fill="#f8fafc" font-size="12" font-family="monospace">permiso_id</text>
    <text x="195" y="77" fill="#fbbf24" font-size="11" font-family="monospace">BIGINT</text>
  </g>

  <!-- 3. permisos -->
  <g transform="translate(710, 120)">
    <rect width="280" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <rect width="280" height="34" rx="10" fill="#0f172a"/>
    <text x="12" y="23" fill="#f8fafc" font-size="14" font-weight="700">🔑 permisos</text>
    <text x="12" y="55" fill="#34d399" font-size="10" font-weight="700">PK</text>
    <text x="45" y="55" fill="#f8fafc" font-size="12" font-family="monospace">id</text>
    <text x="175" y="55" fill="#fbbf24" font-size="11" font-family="monospace">BIGSERIAL</text>
    <text x="45" y="77" fill="#f8fafc" font-size="12" font-family="monospace">nombre</text>
    <text x="175" y="77" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(100)</text>
  </g>

  <!-- 4. usuarios -->
