    <rect width="330" height="225" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <rect width="330" height="34" rx="10" fill="#0f172a"/>
    <text x="12" y="23" fill="#f8fafc" font-size="14" font-weight="700">👤 usuarios</text>
    <text x="12" y="55" fill="#34d399" font-size="10" font-weight="700">PK</text>
    <text x="45" y="55" fill="#f8fafc" font-size="12" font-family="monospace">id</text>
    <text x="220" y="55" fill="#fbbf24" font-size="11" font-family="monospace">BIGSERIAL</text>
    <text x="45" y="77" fill="#f8fafc" font-size="12" font-family="monospace">nombre</text>
    <text x="220" y="77" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(255)</text>
    <text x="45" y="99" fill="#f8fafc" font-size="12" font-family="monospace">correo (UNIQUE)</text>
    <text x="220" y="99" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(255)</text>
    <text x="45" y="121" fill="#f8fafc" font-size="12" font-family="monospace">password (BCrypt)</text>
    <text x="220" y="121" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(255)</text>
    <text x="12" y="143" fill="#60a5fa" font-size="10" font-weight="700">FK</text>
    <text x="45" y="143" fill="#f8fafc" font-size="12" font-family="monospace">rol_id</text>
    <text x="220" y="143" fill="#fbbf24" font-size="11" font-family="monospace">BIGINT</text>
    <text x="45" y="165" fill="#f8fafc" font-size="12" font-family="monospace">estado</text>
    <text x="220" y="165" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(50)</text>
    <text x="12" y="187" fill="#60a5fa" font-size="10" font-weight="700">FK</text>
    <text x="45" y="187" fill="#f8fafc" font-size="12" font-family="monospace">creado_por_id</text>
    <text x="220" y="187" fill="#fbbf24" font-size="11" font-family="monospace">BIGINT</text>
    <text x="45" y="209" fill="#f8fafc" font-size="12" font-family="monospace">fecha_creacion</text>
    <text x="220" y="209" fill="#fbbf24" font-size="11" font-family="monospace">TIMESTAMP</text>
  </g>

  <!-- 5. eventos -->
  <g transform="translate(420, 240)">
    <rect width="360" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <rect width="360" height="34" rx="10" fill="#0f172a"/>
    <text x="12" y="23" fill="#f8fafc" font-size="14" font-weight="700">🔭 eventos</text>
    <text x="12" y="55" fill="#34d399" font-size="10" font-weight="700">PK</text>
    <text x="45" y="55" fill="#f8fafc" font-size="12" font-family="monospace">id</text>
    <text x="245" y="55" fill="#fbbf24" font-size="11" font-family="monospace">BIGSERIAL</text>
    <text x="45" y="77" fill="#f8fafc" font-size="12" font-family="monospace">titulo</text>
    <text x="245" y="77" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(255)</text>
    <text x="45" y="99" fill="#f8fafc" font-size="12" font-family="monospace">descripcion</text>
    <text x="245" y="99" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(2000)</text>
    <text x="45" y="121" fill="#f8fafc" font-size="12" font-family="monospace">fecha (validada)</text>
    <text x="245" y="121" fill="#fbbf24" font-size="11" font-family="monospace">DATE</text>
    <text x="45" y="143" fill="#f8fafc" font-size="12" font-family="monospace">hora</text>
    <text x="245" y="143" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(20)</text>
    <text x="45" y="165" fill="#f8fafc" font-size="12" font-family="monospace">lugar</text>
    <text x="245" y="165" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(255)</text>
    <text x="45" y="187" fill="#f8fafc" font-size="12" font-family="monospace">estado</text>
    <text x="245" y="187" fill="#fbbf24" font-size="11" font-family="monospace">VARCHAR(50)</text>
    <text x="45" y="209" fill="#f8fafc" font-size="12" font-family="monospace">es_masivo</text>
    <text x="245" y="209" fill="#fbbf24" font-size="11" font-family="monospace">BOOLEAN</text>
    <text x="45" y="231" fill="#f8fafc" font-size="12" font-family="monospace">capacidad</text>
    <text x="245" y="231" fill="#fbbf24" font-size="11" font-family="monospace">INTEGER</text>
    <text x="12" y="253" fill="#60a5fa" font-size="10" font-weight="700">FK</text>
    <text x="45" y="253" fill="#f8fafc" font-size="12" font-family="monospace">creado_por_usuario_id</text>
    <text x="245" y="253" fill="#fbbf24" font-size="11" font-family="monospace">BIGINT</text>
  </g>

